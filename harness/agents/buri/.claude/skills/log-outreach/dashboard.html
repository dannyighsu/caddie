<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #d97706;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header span { color: var(--muted); font-size: 13px; }

  .load-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 57px);
    gap: 12px;
  }

  .load-zone p { color: var(--muted); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg); }

  #app { display: none; padding: 28px 32px; max-width: 1200px; margin: 0 auto; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .top-bar h2 { font-size: 15px; font-weight: 600; }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card .value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card.green .value { color: var(--green); }
  .card.orange .value { color: var(--orange); }

  .charts {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .chart-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

  .chart-wrap { position: relative; }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .table-header h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .filters { display: flex; gap: 8px; }

  select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  td { padding: 12px 20px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }

  .medium-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    text-transform: capitalize;
  }

  .medium-phone    { background: #dbeafe; color: #1d4ed8; }
  .medium-email    { background: #f3e8ff; color: #7c3aed; }
  .medium-linkedin { background: #dcfce7; color: #15803d; }
  .medium-physical { background: #fef3c7; color: #92400e; }
  .medium-other    { background: #f3f4f6; color: #374151; }

  .outcome-pip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
  }

  .pip-1, .pip-2 { color: var(--red); }
  .pip-3 { color: var(--muted); }
  .pip-4, .pip-5 { color: var(--green); }

  .follow-up-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--orange);
  }

  .needs-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .need-tag {
    background: var(--accent-light);
    color: var(--accent);
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
  }

  .empty { padding: 32px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Outreach Tracker</h1>
  <span id="data-info"></span>
</header>

<div class="load-zone" id="load-zone">
  <p>Select your outreach data files to get started</p>
  <label class="btn" for="file-input">Load JSONL Files</label>
  <input id="file-input" type="file" multiple accept=".jsonl" style="display:none">
  <p style="font-size:12px; color:#9ca3af;">~/.ignis/buri/outreach/*.jsonl</p>
</div>

<div id="app">
  <div class="top-bar">
    <h2 id="date-range"></h2>
    <div style="display:flex;gap:8px;">
      <select id="week-filter"><option value="all">All time</option></select>
      <label class="btn btn-secondary" for="file-input" style="padding:7px 14px;font-size:13px;cursor:pointer;">Reload</label>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">Total Outreaches</div>
      <div class="value" id="stat-total">—</div>
      <div class="sub" id="stat-weeks-sub"></div>
    </div>
    <div class="card">
      <div class="label">This Week</div>
      <div class="value" id="stat-week">—</div>
      <div class="sub" id="stat-week-sub"></div>
    </div>
    <div class="card green">
      <div class="label">Avg Outcome</div>
      <div class="value" id="stat-avg">—</div>
      <div class="sub">out of 5</div>
    </div>
    <div class="card orange">
      <div class="label">Follow-ups Pending</div>
      <div class="value" id="stat-followups">—</div>
      <div class="sub">need action</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h3>Outreaches per Week</h3>
      <div class="chart-wrap" style="height:180px">
        <canvas id="chart-weekly"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>By Medium</h3>
      <div class="chart-wrap" style="height:180px">
        <canvas id="chart-medium"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Outcome Distribution</h3>
      <div class="chart-wrap" style="height:180px">
        <canvas id="chart-outcome"></canvas>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h3>Entries</h3>
      <div class="filters">
        <select id="filter-medium">
          <option value="all">All mediums</option>
          <option value="phone">Phone</option>
          <option value="email">Email</option>
          <option value="linkedin">LinkedIn</option>
          <option value="physical">Physical</option>
          <option value="other">Other</option>
        </select>
        <select id="filter-outcome">
          <option value="all">All outcomes</option>
          <option value="45">Positive (4–5)</option>
          <option value="3">Neutral (3)</option>
          <option value="12">Cold (1–2)</option>
        </select>
        <select id="filter-followup">
          <option value="all">All</option>
          <option value="yes">Follow-up needed</option>
        </select>
      </div>
    </div>
    <div id="table-wrap"></div>
  </div>
</div>

<script>
let allEntries = [];
let charts = {};

const MEDIUM_COLORS = {
  phone: '#3b82f6',
  email: '#8b5cf6',
  linkedin: '#22c55e',
  physical: '#f59e0b',
  other: '#9ca3af',
};

const OUTCOME_LABELS = { 1: 'Dead end', 2: 'Cold', 3: 'Neutral', 4: 'Positive', 5: 'Strong lead' };

document.getElementById('file-input').addEventListener('change', e => loadFiles(e.target.files));

['filter-medium','filter-outcome','filter-followup','week-filter'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

async function loadFiles(files) {
  allEntries = [];
  for (const file of files) {
    const text = await file.text();
    text.split('\n').forEach(line => {
      line = line.trim();
      if (!line) return;
      try { allEntries.push(JSON.parse(line)); } catch {}
    });
  }
  allEntries.sort((a,b) => a.timestamp.localeCompare(b.timestamp));

  // populate week filter
  const weeks = [...new Set(allEntries.map(e => e.week))].sort();
  const wf = document.getElementById('week-filter');
  wf.innerHTML = '<option value="all">All time</option>';
  weeks.forEach(w => {
    const o = document.createElement('option');
    o.value = w; o.textContent = w;
    wf.appendChild(o);
  });

  document.getElementById('load-zone').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('data-info').textContent = `${allEntries.length} entries from ${files.length} file${files.length !== 1 ? 's' : ''}`;

  render();
}

function currentWeek() {
  const now = new Date();
  const jan4 = new Date(now.getFullYear(), 0, 4);
  const startOfWeek1 = new Date(jan4);
  startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const diff = now - startOfWeek1;
  const weekNum = Math.floor(diff / (7 * 86400000)) + 1;
  return `${now.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}

function filteredEntries() {
  const wf = document.getElementById('week-filter').value;
  const mf = document.getElementById('filter-medium').value;
  const of = document.getElementById('filter-outcome').value;
  const ff = document.getElementById('filter-followup').value;
  return allEntries.filter(e => {
    if (wf !== 'all' && e.week !== wf) return false;
    if (mf !== 'all' && e.medium !== mf) return false;
    if (of === '45' && e.outcome < 4) return false;
    if (of === '3' && e.outcome !== 3) return false;
    if (of === '12' && e.outcome > 2) return false;
    if (ff === 'yes' && !e.follow_up) return false;
    return true;
  });
}

function render() {
  const entries = filteredEntries();
  const thisWeek = currentWeek();

  // Stats
  document.getElementById('stat-total').textContent = entries.length;

  const weeks = [...new Set(allEntries.map(e => e.week))];
  document.getElementById('stat-weeks-sub').textContent = `across ${weeks.length} week${weeks.length !== 1 ? 's' : ''}`;

  const thisWeekEntries = entries.filter(e => e.week === thisWeek);
  document.getElementById('stat-week').textContent = thisWeekEntries.length;
  document.getElementById('stat-week-sub').textContent = thisWeek;

  const outcomes = entries.map(e => e.outcome).filter(Boolean);
  const avg = outcomes.length ? (outcomes.reduce((a,b) => a+b, 0) / outcomes.length).toFixed(1) : '—';
  document.getElementById('stat-avg').textContent = avg;

  const followups = entries.filter(e => e.follow_up).length;
  document.getElementById('stat-followups').textContent = followups;

  // Weekly chart
  const allWeeks = [...new Set(allEntries.map(e => e.week))].sort();
  const weekCounts = allWeeks.map(w => entries.filter(e => e.week === w).length);
  renderBar('chart-weekly', allWeeks, weekCounts, '#3b82f6');

  // Medium chart
  const mediums = ['phone','email','linkedin','physical','other'];
  const medCounts = mediums.map(m => entries.filter(e => e.medium === m).length);
  renderDoughnut('chart-medium', mediums, medCounts, mediums.map(m => MEDIUM_COLORS[m]));

  // Outcome distribution
  const outcomeBins = [1,2,3,4,5];
  const outcomeCounts = outcomeBins.map(o => entries.filter(e => e.outcome === o).length);
  const outcomeColors = ['#ef4444','#f97316','#9ca3af','#22c55e','#16a34a'];
  renderBar('chart-outcome', outcomeBins.map(o => `${o} — ${OUTCOME_LABELS[o]}`), outcomeCounts, outcomeColors, true);

  // Table
  renderTable(entries);
}

function renderBar(id, labels, data, color, multiColor = false) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: multiColor && Array.isArray(color) ? color : color,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 11 } }, grid: { color: '#f3f4f6' } }
      }
    }
  });
}

function renderDoughnut(id, labels, data, colors) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: {
          position: 'right',
          labels: { font: { size: 11 }, padding: 8, boxWidth: 10 }
        }
      }
    }
  });
}

function renderTable(entries) {
  const wrap = document.getElementById('table-wrap');
  if (!entries.length) {
    wrap.innerHTML = '<div class="empty">No entries match the current filters.</div>';
    return;
  }

  const rows = [...entries].reverse().map(e => {
    const date = new Date(e.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const needs = (e.needs || []).map(n => `<span class="need-tag">${esc(n)}</span>`).join('');
    const outcomeClass = e.outcome <= 2 ? 'pip-' + e.outcome : e.outcome === 3 ? 'pip-3' : 'pip-' + e.outcome;
    const followupDot = e.follow_up ? '<span class="follow-up-dot" title="Follow-up needed"></span>' : '';

    return `
      <tr>
        <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${date}</td>
        <td><span class="medium-badge medium-${esc(e.medium || 'other')}">${esc(e.medium || 'other')}</span></td>
        <td>
          <div style="font-weight:500;">${esc(e.contact?.name || '—')}</div>
          <div style="font-size:12px;color:var(--muted);">${esc(e.contact?.company || '')}${e.contact?.role ? ' · ' + esc(e.contact.role) : ''}</div>
        </td>
        <td style="max-width:300px;color:var(--muted);font-size:13px;">${esc(e.summary || '')}</td>
        <td>${needs ? `<div class="needs-list">${needs}</div>` : ''}</td>
        <td><span class="outcome-pip ${outcomeClass}">${e.outcome || '—'}</span> ${followupDot}</td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>Date</th><th>Medium</th><th>Contact</th><th>Summary</th><th>Needs</th><th>Outcome</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
