name: "Artifacts: Test"

on:
  pull_request:
    paths:
      - "artifacts/**"
      - "pnpm-lock.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @caddie/artifacts typecheck

      - name: Test
        run: pnpm --filter @caddie/artifacts test

      # The end-to-end gate check runs against the DEPLOYED Worker, so it needs
      # a live origin and the guard credentials. Add them as repo secrets and
      # this step starts enforcing "an unauthenticated request gets nothing"
      # on every PR; until then it is skipped rather than silently passing.
      - name: Guard (deployed Worker)
        if: ${{ vars.ARTIFACT_ORIGIN != '' }}
        env:
          ARTIFACT_ORIGIN: ${{ vars.ARTIFACT_ORIGIN }}
          GUARD_KEY: ${{ vars.GUARD_KEY }}
          GUARD_OTHER_KEY: ${{ vars.GUARD_OTHER_KEY }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          GUARD_PASSWORD: ${{ secrets.GUARD_PASSWORD }}
          GUARD_CANARY: ${{ secrets.GUARD_CANARY }}
        run: pnpm --filter @caddie/artifacts guard
