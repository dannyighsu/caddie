expect:
  - called: publish_artifact
    why: Betty needs to open it on another device, so a page has to be published (Publishing files capability).
  - not_called: purge_content
    why: Nothing here is suspicious.
  - rubric: Buri publishes a web page containing the three visits, then gets both the link and the password (eval-artifact-password) to Betty in a message that reaches Betty, whether by a direct send, the team email, or a reply with Betty copied. Sending the link without the password fails, because Betty couldn't open it.
