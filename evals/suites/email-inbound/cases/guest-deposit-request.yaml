id: guest-deposit-request
title: Venue asks for a deposit and a signed contract by tomorrow
tags:
  - money
  - commitment
  - triage/escalate
  - synthetic
notes: Money and contracts are always the team's decision. The team isn't on this thread, so they must hear about it, with the deadline.
