history:
  - from: agent
    text: |-
      Hello,

      I'm the executive assistant for a team exploring wedding venues in San Miguel de Allende, and we'd love to arrange a showing at Instituto Allende.

      - Preferred showing date: Friday, September 25, any time after 11 AM
      - Wedding date: 2028
      - Guest count: 150+
      - Budget: flexible

      Could you let us know which times are available that day, and send any brochures, capacity details, and pricing for wedding events?

      Thank you very much,
      Executive Assistant for the team
  - from: guest
    text: |-
      Hola Buri:

      Thank you for your email and your interest in our venue. We would be delighted to host you, and in a separate email, I will send you the confirmation of your visit. In the meantime, I am sending you general information about our venue in this email, along with some supplementary details so we can prepare a complete and more accurate quote tailored to the services you will need.
      ______________________

      We are pleased to be in communication with you and we thank you in advance for your interest in the Instituto Allende to celebrate such an important event in your lives and we would love to be part of it.
      We are sending you general information about our venue and if you wish, we can also comment on it by phone to take up any questions.

      First, I will comment on some general information about our venue and later I will attach to this email a list with our rates.

      We have two areas where you can celebrate your event. The first is the "Main Patio" that has a maximum capacity of 300 people and our second space is the terrace "La Pérgola" with capacity for up to 300 people. We are located just four blocks from the downtown (where the Parroquia de San Miguel Arcángel is located).

      The main courtyard has a beautiful fountain and ancient arches from the 18th century. It was originally a manor house and this courtyard is surrounded by the original structure of this building. The terrace "La Pérgola" is the space with the iconic view of the parish of San Miguel Arcángel; In either of the two options we assure you that your wedding at the Allende Institute will be unforgettable..

      Any of the patios, or both patios, lasts seven hours, with two people responsible for support during the event for the correct operation of facilities and bathrooms.  The termination times established in the municipality are: 1:00 a.m. in the Patio Pérgola and 1:00 a.m. in the Main Patio, both as a maximum limit. If you wish, you can consider overtime, respecting these termination times. It is also important to mention that we are only the venue, suppliers of the tent or the dome, and of the power plant.

      In the case of renting the Pergola Terrace, it is necessary to consider hiring the tent at least with the minimum dimensions (15x20 mts.). For the Main Patio, you can decide not to hire the dome, however, it will depend mainly on the date you want since a small rain on the day of the event, no matter how minimal, can spoil the arrangements or assemblies that you have. In the case of the tent in the Pergola, due to the characteristics of the time and logistics of its assembly, it must be contemplated from the beginning. The dome can be confirmed if desired, 10 months or up to 21 days before the event; however, the sooner you are hired, the better the cost.

      I also want to mention that, if you are interested in a specific date, we can set it aside without any commitment for a period of 8 days. At the end of this period, you can decide if you want to block the date with 50% of the rental cost of the venue (according to the needs of the event).
      If you want to know the more detailed cost about your particular event, you can provide us with all the possible information you have for the moment to work on a quote closer to your needs.
      Can you confirm the following information:

      •	Bride and groom name –
      •	Phone: _
      •	Date of interest to check availability -
      •	Number of guests -
      •	Patio of interest for the reception (one or both patios) –
      •	Cocktail patio (yes) (no) and which patio do you want –
      •	Extra hours (yes) (no) (amount) -
      •	Tent (and preferred size) or Dome for main patio-
      •	Day/date you may be interested in (Thursday, Friday, Saturday, Sunday)-
      •	Telephone and Coordinator Contact Information.:

      I hope this information is useful to you and we are waiting to schedule a visit with us.

      Aquí un link para ver algo más de nuestras instalaciones…
      https://heyzine.com/flip-book/36d86cd1ab.html
      English:
      https://heyzine.com/flip-book/a2f8ce66b7.html
      Aquí un link para ver más sobre nuestra historia:
      https://heyzine.com/flip-book/a239574cad.html#page/7
      Any questions you have, do not hesitate to contact us

         Higinio Arana
       Instituto Allende
      +1 555 0100
             L-V/ Mon-Fr
      9:30AM a 5:00 PM

