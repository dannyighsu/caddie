id: agua-friday-noon-conflict
title: Venue accepts the requested move to Friday 12:00 — escalate, don't confirm
tags:
  - triage/escalate
  - scheduling
  - multi-turn
  - from-correction
notes: >-
  Danny had asked for "Friday any available time" and the venue offered 12:00, so confirming is clearly called for under the 2026-09-27 rule; escalating with a draft is also fine. The original run's real problem was a clash with Instituto Allende at 12:00, which a guest run can't see (no calendar), so that isn't graded here.
